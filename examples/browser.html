<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fingerprint Framework Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f3;
        color: #1f2933;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #115e59;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      pre {
        overflow: auto;
        min-height: 220px;
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #d8ded8;
        border-radius: 8px;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fingerprint Framework</h1>
      <button type="button" id="identify">Identify</button>
      <pre id="output">Ready</pre>
    </main>

    <script src="../dist/browser/fingerprint-framework.js"></script>
    <script>
      const output = document.querySelector('#output');
      const client = FingerprintFramework.createClient({
        namespace: location.hostname || 'browser-demo',
        profile: 'balanced',
        policy: { redactValues: true }
      });

      client.prepare();

      document.querySelector('#identify').addEventListener('click', async () => {
        output.textContent = 'Collecting...';
        const result = await client.get({ consent: { granted: true, purpose: 'demo' } });
        output.textContent = JSON.stringify(result, null, 2);
      });
    </script>
  </body>
</html>
